<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live TV</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #status {
    position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%);
    max-width: 80vw; padding: 10px 18px; border-radius: 10px;
    background: rgba(0,0,0,.72); color: #e8e8ea; font: 500 15px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center;
  }
  #status.show { opacity: 1; }
  #picker { position: fixed; inset: 0; display: none; background: rgba(0,0,0,.55); z-index: 10; }
  #picker.open { display: block; }
  #panel {
    position: absolute; width: min(380px, calc(100vw - 24px)); max-height: min(560px, calc(100vh - 24px));
    display: flex; flex-direction: column; background: #16171b; color: #e8e8ea;
    border: 1px solid #2b2d34; border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.6);
    font: 14px/1.35 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden;
  }
  #q {
    margin: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid #34363f;
    background: #0e0f12; color: #fff; font: inherit; outline: none;
  }
  #q:focus { border-color: #6d8cff; }
  #list { overflow-y: auto; padding: 0 6px 8px; margin: 0; list-style: none; }
  #list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  #list li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list li .g { flex: none; color: #8a8d98; font-size: 12px; align-self: center; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list li.sel { background: #262a3a; }
  #list li.cur .n::before { content: "\25B6\00a0"; color: #6d8cff; }
  #empty { padding: 18px; color: #8a8d98; text-align: center; display: none; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div id="status" role="status" aria-live="polite"></div>
<div id="picker" aria-hidden="true">
  <div id="panel" role="dialog" aria-label="Channels">
    <input id="q" type="search" placeholder="Recent channels (type to search all)" autocomplete="off" spellcheck="false">
    <ul id="list"></ul>
    <div id="empty">No matching channels</div>
  </div>
</div>
<script src="/hls.min.js"></script>
<script src="/player.js"></script>
<script src="/guide.js"></script>
</body>
</html>
